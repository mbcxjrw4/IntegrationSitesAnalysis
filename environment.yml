name: integration_sites_analysis

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Core languages
  - r-base=4.2        # or whichever R version you are using

  # R packages from Bioconda / Conda / CRAN
  - bioconductor-genomicranges
  - bioconductor-rtracklayer
  - bioconductor-chipseeker
  - bioconductor-txdb.hsapiens.ucsc.hg38.knowngene
  - bioconductor-org.hs.eg.db
  - bioconductor-bsgenome.hsapiens.ucsc.hg38
  - bioconductor-biostrings

  - r-ggplot2
  - r-dplyr
  - r-data.table
  - r-ineq
  - r-vegan
  - r-seqlogo
  - r-optparse
  - r-rmarkdown
  - r-knitr

  # System / other tools
  - bedtools
  - samtools            # if needed for FASTA manipulations
  - wget                # for downloading public datasets
  - curl
